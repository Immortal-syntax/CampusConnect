<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield / Rounded Container -->
  <rect x="10" y="10" width="220" height="220" rx="48" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="3" />

  <!-- Outer Tech Circuit Ring (Subtle) -->
  <circle cx="120" cy="120" r="85" fill="none" stroke="#1E3A8A" stroke-width="2" stroke-dasharray="6 8" opacity="0.6" />

  <!-- Mortarboard Cap (Top) -->
  <polygon points="120,55 195,90 120,122 45,90" fill="url(#primaryGrad)" filter="url(#glow)" />

  <!-- Mortarboard Skullcap (Bottom base) -->
  <path d="M75,108 L75,135 C75,158 165,158 165,135 L165,108 L120,130 Z" fill="#0052CC" opacity="0.9" />

  <!-- Tassel Ribbon & Ring -->
  <circle cx="120" cy="88" r="4.5" fill="#FFFFFF" />
  <path d="M120,88 Q165,85 178,110 L182,145" fill="none" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round" />
  <circle cx="182" cy="148" r="4" fill="#38BDF8" />

  <!-- AI Connectivity Nodes -->
  <g stroke="#38BDF8" stroke-width="2">
    <line x1="120" y1="130" x2="120" y2="175" />
    <line x1="120" y1="175" x2="80" y2="195" />
    <line x1="120" y1="175" x2="160" y2="195" />
  </g>

  <!-- Glowing Connection Dots -->
  <circle cx="120" cy="175" r="5" fill="#38BDF8" />
  <circle cx="80" cy="195" r="6" fill="url(#primaryGrad)" />
  <circle cx="160" cy="195" r="6" fill="url(#primaryGrad)" />
  <circle cx="120" cy="120" r="3" fill="#FFFFFF" />
</svg>
